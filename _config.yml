title: Hao Gu
description: >-
  Hao Gu is a Ph.D. student at HKUST and a research intern at Tencent Hunyuan,
  working on LLM architecture and pre-training, currently sparse attention.

# NOTE: a GitHub Pages *user site* is served at <github-username>.github.io.
# Your username is "Chooovy", so the repo must be named chooovy.github.io
# unless you rename the account to "marcusguhao" (or attach a custom domain).
url: "https://marcusguhao.github.io"
baseurl: ""

author:
  name: Hao Gu
  short: hao gu
  affiliation: HKUST
  affiliation_full: The Hong Kong University of Science and Technology
  affiliation_url: https://hkust.edu.hk/
  email: marcusguhao@gmail.com
  cv: ""                         # TODO e.g. /assets/file/cv.pdf (hidden while empty)
  scholar: https://scholar.google.com/citations?user=ozg7axcAAAAJ
  github: https://github.com/Chooovy
  twitter: https://x.com/guhao05612970
  twitter_handle: "@guhao05612970"
  wechat: MarkusFits
  wechat_qr: /assets/img/wechat-qr.jpg
  linkedin: ""                   # optional
  zhihu: ""                      # optional

# Scholar numbers shown in the hero (update by hand now and then)
scholar_stats:
  citations: 237
  h_index: 8
  i10_index: 6
  updated: Nov 2026

timezone: Asia/Hong_Kong
lang: en
permalink: /blog/:year/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: null
  syntax_highlighter_opts:
    css_class: highlight

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, math: false }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
