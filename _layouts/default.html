<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body class="page-{{ page.nav | default: 'page' }}" id="top">
<a class="skip" href="#main">Skip to content</a>
{% include nav.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<dialog class="qr" id="wechat-dialog" aria-label="WeChat">
  <form method="dialog"><button class="qr-close" aria-label="Close">×</button></form>
  <img src="{{ site.author.wechat_qr | relative_url }}" alt="WeChat QR code for {{ site.author.wechat }}" width="456" height="677" loading="lazy">
  <div class="qr-foot">
    <span>WeChat ID <b>{{ site.author.wechat }}</b></span>
    <button class="pill pill-dark pill-xs" type="button" id="wechat-copy">Copy ID</button>
  </div>
</dialog>
<script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
