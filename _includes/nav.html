{%- assign home = '/' | relative_url -%}
<header class="topbar" id="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ home }}">{{ site.author.name }}</a>
    <nav class="nav" aria-label="Main">
      <a href="{{ home }}#research" {% if page.nav == 'home' %}data-spy{% endif %}>Research</a>
      <a href="{{ home }}#publications" {% if page.nav == 'home' %}data-spy{% endif %}>Publications</a>
      <a href="{{ home }}#news" {% if page.nav == 'home' %}data-spy{% endif %}>News</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.nav == 'blog' %}aria-current="page"{% endif %}>Blog</a>
    </nav>
    <a class="pill pill-dark pill-sm nav-cta" href="mailto:{{ site.author.email }}">{% include icon.html name="mail" %}Email</a>
  </div>
</header>
