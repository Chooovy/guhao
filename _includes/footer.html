<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-left">
      <div class="footer-sig">{{ site.author.name }}</div>
      <div class="footer-meta">© {{ site.time | date: '%Y' }} · Built with Jekyll on GitHub Pages · Updated {{ site.time | date: '%b %-d, %Y' }}</div>
    </div>
    <div class="footer-right">
      <span class="footer-weight" id="page-weight" hidden></span>
      <a href="{{ '/feed.xml' | relative_url }}">{% include icon.html name="rss" %} RSS</a>
      <a href="#top" class="to-top">Back to top ↑</a>
    </div>
  </div>
</footer>
