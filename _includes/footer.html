<footer class="finale" id="contact">
  <div class="wrap">
    <div class="finale-inner" id="finale-card">
      <canvas class="attn" id="attn" aria-hidden="true"></canvas>
      <div class="finale-content">
        <p class="finale-kicker">Feel free to connect</p>
        <h2 class="finale-title">Open to collaborations<br class="br-lg"> and discussions.</h2>
        <div class="finale-actions">
          <a class="pill pill-white" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
          <button class="pill pill-ghost" type="button" data-wechat>{% include icon.html name="wechat" %}WeChat</button>
          <a class="pill pill-ghost" href="{{ site.author.twitter }}" target="_blank" rel="noopener">{% include icon.html name="x" %}X</a>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap footbar">
    <span>© {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
    <nav aria-label="Footer">
      <a href="mailto:{{ site.author.email }}">Email</a>
      <a href="{{ site.author.twitter }}" target="_blank" rel="noopener">X</a>
      <a href="{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ site.author.scholar }}" target="_blank" rel="noopener">Scholar</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</footer>
